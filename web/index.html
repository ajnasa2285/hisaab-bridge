<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Hisaab Bridge</title>
  <link rel="stylesheet" href="judge.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 data-t="title">हिसाब ब्रिज — जज पेज</h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div class="controls">
      <label class="btn"><span data-t="load"></span><input id="file" type="file" accept="application/json" hidden></label>
      <button id="lang" class="btn" type="button"></button>
    </div>
  </header>

  <section class="live">
    <h2 data-t="live_title"></h2>
    <form id="live-form" class="live-form" autocomplete="off">
      <label for="key" data-t="key_label"></label>
      <input id="key" type="password" autocomplete="off" spellcheck="false">
      <button id="load-live" class="btn" type="submit" data-t="load_live"></button>
      <button id="use-sample" class="btn" type="button" data-t="use_sample"></button>
      <label class="btn live-toggle"><input id="live-toggle" type="checkbox"> <span data-t="live_toggle"></span></label>
    </form>
    <p class="hint" data-t="live_hint"></p>
  </section>

  <p id="notice" class="notice" hidden></p>

  <section id="summary" class="summary" hidden>
    <div class="cell"><span class="k" data-t="source"></span><span id="source"></span></div>
    <div class="cell"><span class="k" data-t="orders"></span><span id="order"></span></div>
    <div class="cell"><span class="k" data-t="exported_at"></span><span id="exported"></span></div>
  </section>

  <section id="ledgers" class="ledger-cards" hidden>
    <h2 data-t="ledgers"></h2>
    <div id="ledger-cards" class="cards"></div>
    <div id="cross-check" class="card cross"></div>
  </section>

  <main id="orders"></main>

  <section class="results">
    <h2 data-t="results"></h2>
    <p class="hint" data-t="results_hint"></p>
    <div id="results-body">—</div>
  </section>

  <script type="module" src="judge.js"></script>
</body>
</html>
